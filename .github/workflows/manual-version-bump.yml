name: Manual Version Bump and PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to set, e.g. 2.14.0-dev'
        required: true
        type: string
  # called by release.yml to start the next version after a release
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  set-version-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: dotnet build build/Build.proj /t:UpdateVersion "/p:SetVersion=$VERSION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "bump version to ${{ inputs.version }}"
          body: "Automated version bump to ${{ inputs.version }}."
          branch: version-bump/${{ inputs.version }}
          commit-message: "Bump version to ${{ inputs.version }}"
